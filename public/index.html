<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Client - AFK Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .card h2 { font-size: 1.1rem; color: #94a3b8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #0369a1; }
        .log-box { background: #020617; border: 1px solid #334155; height: 180px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.85rem; color: #4ade80; border-radius: 4px; }
        .bot-item { background: #0f172a; padding: 8px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #0284c7; }
        .stats-val { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <h1>Sleepy Client Dashboard</h1>

    <div class="grid">
        <!-- System Stats -->
        <div class="card">
            <h2>System Health</h2>
            <p>CPU Load: <span id="cpu-stat" class="stats-val">0%</span></p>
            <p>RAM Usage: <span id="ram-stat" class="stats-val">0%</span></p>
        </div>

        <!-- Deploy Bot -->
        <div class="card">
            <h2>Deploy New Bot</h2>
            <input type="text" id="username" placeholder="Bot Username (Optional)">
            <input type="password" id="password" placeholder="Password (Optional)">
            <select id="auth">
                <option value="offline">Offline / Cracker</option>
                <option value="microsoft">Microsoft Auth</option>
            </select>
            <input type="text" id="proxy" placeholder="Proxy (IP:Port)">
            <button onclick="deployBot()">Deploy Bot</button>
        </div>

        <!-- Global Control -->
        <div class="card">
            <h2>Global Commands</h2>
            <input type="text" id="globalCmd" placeholder="/afk, /say Hello">
            <button onclick="sendGlobalCommand()">Execute Across All Bots</button>
        </div>
    </div>

    <div class="grid">
        <!-- Active Bots -->
        <div class="card">
            <h2>Active Bots</h2>
            <div id="active-bots-list">No bots active.</div>
        </div>

        <!-- Proxy Down Queue -->
        <div class="card">
            <h2>Proxy Down Queue</h2>
            <div id="proxy-down-list">No failed proxies.</div>
            <div id="revive-controls" style="display:none; margin-top: 10px;">
                <input type="text" id="newProxy" placeholder="New Proxy (IP:Port)">
                <button onclick="reviveBots()">Revive Selected Bots</button>
            </div>
        </div>
    </div>

    <!-- Live System Logs -->
    <div class="card">
        <h2>Live System Logs</h2>
        <div class="log-box" id="sys-logs"></div>
    </div>

    <script>
        const socket = io();

        // Stats listener
        socket.on('sys_stats', data => {
            document.getElementById('cpu-stat').innerText = `${data.cpu}%`;
            document.getElementById('ram-stat').innerText = `${data.ram}%`;
        });

        // Logs listener
        socket.on('sys_log', msg => {
            const logs = document.getElementById('sys-logs');
            const entry = document.createElement('div');
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        });

        // Active Bots render
        socket.on('update_bots', bots => {
            const list = document.getElementById('active-bots-list');
            if (bots.length === 0) {
                list.innerHTML = 'No bots active.';
                return;
            }
            list.innerHTML = bots.map(b => `
                <div class="bot-item">
                    <div>
                        <strong>${b.username}</strong>
                        <div style="font-size:0.75rem; color:#94a3b8;">${b.status}</div>
                    </div>
                    <div>${formatUptime(b.uptime)}</div>
                </div>
            `).join('');
        });

        // Proxy Down render
        socket.on('update_proxy_down', bots => {
            const list = document.getElementById('proxy-down-list');
            const reviveControls = document.getElementById('revive-controls');
            if (bots.length === 0) {
                list.innerHTML = 'No failed proxies.';
                reviveControls.style.display = 'none';
                return;
            }
            reviveControls.style.display = 'block';
            list.innerHTML = bots.map(b => `
                <div class="bot-item" style="border-left-color: #ef4444;">
                    <div>
                        <input type="checkbox" class="revive-checkbox" value="${b.id}" checked>
                        <strong>${b.username}</strong>
                    </div>
                    <div>${formatUptime(b.uptime)}</div>
                </div>
            `).join('');
        });

        function deployBot() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const auth = document.getElementById('auth').value;
            const proxyStr = document.getElementById('proxy').value;

            socket.emit('deploy', { username, password, auth, proxyStr });
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('proxy').value = '';
        }

        function sendGlobalCommand() {
            const cmd = document.getElementById('globalCmd').value;
            if (cmd) {
                socket.emit('global_command', cmd);
                document.getElementById('globalCmd').value = '';
            }
        }

        function reviveBots() {
            const checkboxes = document.querySelectorAll('.revive-checkbox:checked');
            const ids = Array.from(checkboxes).map(cb => cb.value);
            const newProxy = document.getElementById('newProxy').value;

            if (ids.length > 0 && newProxy) {
                socket.emit('revive_bots', { ids, newProxy });
                document.getElementById('newProxy').value = '';
            }
        }

        function formatUptime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const hrs = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;
            return `${hrs}h ${mins}m ${secs}s`;
        }
    </script>
</body>
</html>
