<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamsterMan AFK & Evasion Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: #121824;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --accent-yellow: #ffcc00;
      --text-main: #e2e8f0;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    .sidebar { width: 280px; background: #07090e; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
    .logo { font-size: 1.4rem; font-weight: bold; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }

    .staff-section { margin-top: auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .staff-title { font-size: 0.85rem; color: var(--accent-cyan); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .staff-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .staff-card { display: flex; align-items: center; justify-content: space-between; background: #0d121d; padding: 6px 10px; border-radius: 6px; border: 1px solid #1e293b; }
    .staff-info { display: flex; align-items: center; gap: 8px; }
    .staff-avatar { width: 24px; height: 24px; border-radius: 4px; }
    .remove-staff-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-weight: bold; font-size: 1rem; }
    .remove-staff-btn:hover { color: #ff6688; }
    .add-staff-form { display: flex; gap: 6px; }
    .add-staff-form input { flex: 1; background: #07090e; border: 1px solid var(--border-color); color: #fff; padding: 6px; border-radius: 4px; font-size: 0.8rem; }
    .add-staff-form button { background: var(--accent-cyan); border: none; color: #000; font-weight: bold; padding: 6px 10px; border-radius: 4px; cursor: pointer; }

    /* Main Workspace */
    .main-content { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .action-btn { background: var(--accent-green); color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    /* Analytics Cards */
    .grid-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 18px; border-radius: 8px; }
    .card-num { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: var(--accent-cyan); }

    /* Tables */
    .table-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .table-title { font-size: 1rem; margin-bottom: 12px; color: var(--accent-cyan); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }

    .progress-bar-bg { background: #1e293b; width: 100%; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { background: var(--accent-green); height: 100%; width: 0%; transition: width 0.3s; }

    /* Console Logs */
    .console-box { background: #05070a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; }
    .log-line { margin-bottom: 4px; }
    .log-info { color: #94a3b8; }
    .log-success { color: var(--accent-green); }
    .log-warn { color: var(--accent-yellow); }
    .log-error { color: var(--accent-red); }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">GamsterMan v2.0</div>
    
    <!-- Staff Management Component -->
    <div class="staff-section">
      <div class="staff-title">
        <span>Staff Evasion List</span>
      </div>
      <div class="staff-list" id="staffList"></div>
      <div class="add-staff-form">
        <input type="text" id="newStaffInput" placeholder="Staff Username...">
        <button onclick="addStaff()">Add</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header-bar">
      <h2>Manager Overview</h2>
      <button class="action-btn" onclick="startBotsPrompt()">+ Launch Bots</button>
    </div>

    <!-- Metrics -->
    <div class="grid-cards">
      <div class="card">
        <div>Active Bots</div>
        <div class="card-num" id="statActive">0</div>
      </div>
      <div class="card">
        <div>Target Reached (20h 10m)</div>
        <div class="card-num" id="statCompleted" style="color: var(--accent-green);">0</div>
      </div>
      <div class="card">
        <div>Proxy Down</div>
        <div class="card-num" id="statProxyDown" style="color: var(--accent-yellow);">0</div>
      </div>
      <div class="card">
        <div>Banned Bots</div>
        <div class="card-num" id="statBanned" style="color: var(--accent-red);">0</div>
      </div>
    </div>

    <!-- Active Bots Table -->
    <div class="table-section">
      <div class="table-title">Active Bots</div>
      <table>
        <thead>
          <tr>
            <th>Bot Name</th>
            <th>Proxy</th>
            <th>Ping</th>
            <th>Drops</th>
            <th>20h 10m Progress</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="activeBotsTable"></tbody>
      </table>
    </div>

    <!-- Proxy Down Table -->
    <div class="table-section">
      <div class="table-title" style="color: var(--accent-yellow);">Proxy Down Table (Exceeded 5 Drops)</div>
      <table>
        <thead>
          <tr>
            <th>Bot Name</th>
            <th>Failed Proxy</th>
            <th>Reason</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="proxyDownTable"></tbody>
      </table>
    </div>

    <!-- Console Box -->
    <div class="console-box" id="consoleBox"></div>
  </div>

  <script>
    const socket = io();
    const TARGET_MS = (20 * 3600 + 10 * 60) * 1000;

    socket.on('state_update', (data) => {
      document.getElementById('statActive').innerText = data.bots.length;
      document.getElementById('statCompleted').innerText = data.targetCompleted.length;
      document.getElementById('statProxyDown').innerText = data.proxyDown.length;
      document.getElementById('statBanned').innerText = data.bannedBots.length;

      renderStaffList(data.staff);
      renderActiveBots(data.bots);
      renderProxyDown(data.proxyDown);
    });

    socket.on('log', (log) => {
      const box = document.getElementById('consoleBox');
      const div = document.createElement('div');
      div.className = `log-line log-${log.type}`;
      div.innerText = `[${log.timestamp}] ${log.msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    function renderStaffList(staff) {
      const container = document.getElementById('staffList');
      container.innerHTML = staff.map(s => `
        <div class="staff-card">
          <div class="staff-info">
            <img class="staff-avatar" src="https://mc-heads.net/avatar/${s}/64" alt="${s}">
            <span>${s}</span>
          </div>
          <button class="remove-staff-btn" onclick="removeStaff('${s}')">×</button>
        </div>
      `).join('');
    }

    function renderActiveBots(bots) {
      const container = document.getElementById('activeBotsTable');
      container.innerHTML = bots.map(b => {
        const pct = Math.min(100, ((b.afkDurationMs / TARGET_MS) * 100)).toFixed(1);
        return `
          <tr>
            <td><b>${b.username}</b></td>
            <td>${b.proxy}</td>
            <td>${b.ping} ms</td>
            <td>${b.dropCount} / 5</td>
            <td style="width: 180px;">
              <div>${pct}% (${formatMs(b.afkDurationMs)})</div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pct}%;"></div>
              </div>
            </td>
            <td><span style="color: var(--accent-green);">${b.status}</span></td>
            <td><button onclick="stopBot('${b.username}')" style="background: var(--accent-red); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Stop</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderProxyDown(list) {
      const container = document.getElementById('proxyDownTable');
      container.innerHTML = list.map(item => `
        <tr>
          <td>${item.username}</td>
          <td>${item.proxy}</td>
          <td>${item.reason}</td>
          <td>${item.timestamp}</td>
        </tr>
      `).join('');
    }

    function addStaff() {
      const input = document.getElementById('newStaffInput');
      if (input.value.trim()) {
        socket.emit('add_staff', input.value.trim());
        input.value = '';
      }
    }

    function removeStaff(name) {
      socket.emit('remove_staff', name);
    }

    function stopBot(username) {
      socket.emit('stop_bot', username);
    }

    function startBotsPrompt() {
      const input = prompt('Enter bots in format "username:password", separated by commas:');
      if (input) {
        const botList = input.split(',').map(item => {
          const [username, password] = item.trim().split(':');
          return { username, password };
        });
        socket.emit('start_bots', botList);
      }
    }

    function formatMs(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      return `${h}h ${m}m`;
    }
  </script>
</body>
</html>
