<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBot AFK Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-modal: #111116;
            --accent: #9333ea;
            --accent-dark: #6b21a8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Glassmorphism Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(17, 17, 22, 0.6);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(147, 51, 234, 0.2);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }
        .brand { font-size: 24px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 30px; text-shadow: 0 0 10px var(--accent); }
        .nav-item { padding: 15px 25px; cursor: pointer; transition: 0.3s; color: var(--text-muted); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(147, 51, 234, 0.1); color: var(--accent); border-left: 3px solid var(--accent); }
        
        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 30px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--accent); }
        
        /* Telemetry Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: rgba(17, 17, 22, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stat-card h3 { color: var(--text-muted); font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card p { font-size: 24px; font-weight: bold; color: var(--accent); text-shadow: 0 0 8px rgba(147,51,234,0.4); }

        /* Console */
        .console {
            flex: 1;
            background: #050505;
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            color: #10b981;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .console p { margin-bottom: 5px; line-height: 1.4; }
        
        /* Controls */
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        input, select { background: var(--bg-modal); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 6px; outline: none; width: 100%; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(147,51,234,0.3); }
        button { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { box-shadow: 0 0 15px var(--accent); transform: translateY(-2px); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--bg-modal); padding: 30px; border-radius: 12px; width: 400px; border: 1px solid rgba(147, 51, 234, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal h2 { margin-bottom: 20px; text-align: center; color: var(--accent); }
        .modal input, .modal select { margin-bottom: 15px; }
        .hidden { display: none !important; }
        
        /* Role based visibility */
        .pro-only, .admin-only { display: none; }
    </style>
</head>
<body>

    <!-- Authentication Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <h2>NexBot Login</h2>
            <input type="text" id="authUsername" placeholder="Username">
            <input type="password" id="authPassword" placeholder="Password">
            <div style="display: flex; gap: 10px;">
                <button style="flex: 1;" onclick="login()">Login</button>
                <button style="flex: 1; background: #333;" onclick="register()">Sign Up</button>
            </div>
            <p id="authMessage" style="margin-top: 15px; font-size: 12px; text-align: center; color: var(--accent);"></p>
        </div>
    </div>

    <!-- Deploy Modal -->
    <div id="deployModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>Deploy Bot</h2>
            <input type="text" id="botHost" placeholder="Server IP (e.g. gamester.org)">
            <select id="botAuth" onchange="toggleAuthFields()">
                <option value="offline">Cracked (Offline)</option>
                <option value="microsoft">Microsoft (OAuth)</option>
            </select>
            <div id="authFields">
                <input type="text" id="botUsername" placeholder="Bot Username">
                <input type="password" id="botPassword" placeholder="Auto-Login Password (Optional)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button style="flex: 1;" onclick="submitDeploy()">Launch</button>
                <button style="flex: 1; background: #333;" onclick="document.getElementById('deployModal').classList.add('hidden')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">NexBot</div>
        <div class="nav-item active">Dashboard</div>
        <div class="nav-item">Console</div>
        <div class="nav-item">Proxy Down Events</div>
        <div class="nav-item pro-only">Staff Management</div>
        <div class="nav-item admin-only">Proxy Admin</div>
        <div class="nav-item">Tutorial</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h2>System Overview</h2>
            <div class="user-profile hidden" id="userProfile">
                <span id="roleBadge" style="color: var(--accent); font-weight: bold;"></span>
                <img id="userAvatar" src="" alt="Avatar">
            </div>
        </div>

        <div class="stats-grid admin-only">
            <div class="stat-card"><h3>CPU Usage</h3><p id="cpuStat">0%</p></div>
            <div class="stat-card"><h3>RAM Usage</h3><p id="ramStat">0%</p></div>
            <div class="stat-card"><h3>Disk Usage</h3><p id="diskStat">0%</p></div>
        </div>

        <div class="console" id="consoleBox">
            <p style="color: #64748b;">[System] Waiting for initialization...</p>
        </div>

        <div class="controls">
            <button onclick="document.getElementById('deployModal').classList.remove('hidden')">Deploy New Bot</button>
            <input type="text" id="globalChatInput" placeholder="Global Chat Message...">
            <button onclick="sendGlobalChat()" style="background: #3b82f6;">Send Global</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUsername = "";

        // UI Logic
        function toggleAuthFields() {
            const authType = document.getElementById('botAuth').value;
            const authFields = document.getElementById('authFields');
            if (authType === 'microsoft') {
                authFields.classList.add('hidden'); // Microsoft handles auth in browser/console link
            } else {
                authFields.classList.remove('hidden');
            }
        }

        function logToConsole(msg) {
            const box = document.getElementById('consoleBox');
            const p = document.createElement('p');
            const time = new Date().toLocaleTimeString();
            p.innerText = `[${time}] ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }

        // Socket Actions
        function register() {
            socket.emit('register', {
                username: document.getElementById('authUsername').value,
                password: document.getElementById('authPassword').value
            });
        }

        function login() {
            socket.emit('login', {
                username: document.getElementById('authUsername').value,
                password: document.getElementById('authPassword').value
            });
        }

        function submitDeploy() {
            const host = document.getElementById('botHost').value;
            const auth = document.getElementById('botAuth').value;
            const username = document.getElementById('botUsername').value;
            const password = document.getElementById('botPassword').value;

            socket.emit('deploy_bot', { host, auth, username, password });
            document.getElementById('deployModal').classList.add('hidden');
            logToConsole(`Deploying bot to ${host}...`);
        }

        function sendGlobalChat() {
            const msg = document.getElementById('globalChatInput').value;
            if(!msg) return;
            socket.emit('global_chat', msg);
            document.getElementById('globalChatInput').value = '';
        }

        // Socket Listeners
        socket.on('auth_success', (data) => {
            document.getElementById('authMessage').innerText = data.message;
        });

        socket.on('auth_error', (msg) => {
            document.getElementById('authMessage').innerText = msg;
            document.getElementById('authMessage').style.color = '#ef4444';
        });

        socket.on('login_success', (user) => {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('userProfile').classList.remove('hidden');
            
            // Set Minotar Avatar
            currentUsername = user.username;
            document.getElementById('userAvatar').src = `https://minotar.net/avatar/${user.username}/40.png`;
            document.getElementById('roleBadge').innerText = `[${user.role}]`;

            // Unhide role-based elements
            if (user.role === 'Pro' || user.role === 'Admin') {
                document.querySelectorAll('.pro-only').forEach(e => e.style.display = 'block');
            }
            if (user.role === 'Admin') {
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'grid'); // Grid for stats, block for others handled in CSS normally, but quick override here:
                document.querySelectorAll('.admin-only:not(.stats-grid)').forEach(e => e.style.display = 'block');
            }
            
            logToConsole(`Logged in successfully as ${user.username} (${user.role})`);
        });

        socket.on('sys_stats', (stats) => {
            document.getElementById('cpuStat').innerText = `${stats.cpu}%`;
            document.getElementById('ramStat').innerText = `${stats.ram}%`;
            document.getElementById('diskStat').innerText = `${stats.disk}%`;
        });

        socket.on('bot_log', (data) => {
            logToConsole(data.msg);
        });

        socket.on('proxy_down', (data) => {
            logToConsole(`[CRITICAL] Proxy failed 5 times for bot ${data.botId} on ${data.host}. Abandoning reconnection.`);
        });
    </script>
</body>
</html>
