<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamsterMan AFK & Evasion Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: #121824;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --accent-yellow: #ffcc00;
      --text-main: #e2e8f0;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Layout Wrapper */
    .app-container { display: flex; width: 100%; min-height: 100vh; }

    /* Sidebar Navigation */
    .sidebar { width: 300px; background: #07090e; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    .staff-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-top: auto; }
    .staff-title { font-size: 0.85rem; color: var(--accent-cyan); text-transform: uppercase; margin-bottom: 12px; font-weight: bold; }
    .staff-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .staff-card { display: flex; align-items: center; justify-content: space-between; background: #0d121d; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
    .staff-info { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .staff-avatar { width: 24px; height: 24px; border-radius: 4px; }
    .remove-staff-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-weight: bold; font-size: 1.1rem; padding: 0 4px; }
    
    .add-staff-form { display: flex; gap: 6px; }
    .add-staff-form input { flex: 1; background: #07090e; border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    .add-staff-form button { background: var(--accent-cyan); border: none; color: #000; font-weight: bold; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

    /* Main Content Area */
    .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header-bar h2 { font-size: 1.5rem; font-weight: 700; color: #fff; }

    /* Control Inputs Grid (Makyoubig-ai style form inputs) */
    .control-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .input-group input, .input-group textarea { background: #07090e; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    .input-group textarea { resize: vertical; min-height: 80px; font-family: monospace; }
    
    .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 0.88rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.88; }
    .btn-success { background: var(--accent-green); color: #000; }
    .btn-danger { background: var(--accent-red); color: #fff; }

    /* Metrics Overview Grid */
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 8px; }
    .card-title { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .card-num { font-size: 1.8rem; font-weight: bold; margin-top: 6px; color: var(--accent-cyan); }

    /* Tables Container (Responsive horizontal scroll for small screens) */
    .table-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; overflow: hidden; }
    .table-title { font-size: 0.95rem; margin-bottom: 12px; color: var(--accent-cyan); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; background: #0c1018; }

    .progress-bar-bg { background: #1e293b; width: 120px; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { background: var(--accent-green); height: 100%; width: 0%; transition: width 0.3s; }

    /* Console Box */
    .console-box { background: #05070a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; }
    .log-line { margin-bottom: 4px; word-break: break-all; }
    .log-info { color: #94a3b8; }
    .log-success { color: var(--accent-green); }
    .log-warn { color: var(--accent-yellow); }
    .log-error { color: var(--accent-red); }

    /* Mobile & Laptop Adaptations */
    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); }
      .main-content { padding: 15px; }
      .grid-cards { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .grid-cards { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar / Mobile Top Bar -->
    <div class="sidebar">
      <div class="logo">🎮 GamsterMan v2.0</div>
      
      <!-- Staff Management Component -->
      <div class="staff-section">
        <div class="staff-title">Staff Evasion List</div>
        <div class="staff-list" id="staffList"></div>
        <div class="add-staff-form">
          <input type="text" id="newStaffInput" placeholder="Staff Name...">
          <button onclick="addStaff()">Add</button>
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
      <div class="header-bar">
        <h2>Control Panel</h2>
      </div>

      <!-- Bot Fleet Configuration Form -->
      <div class="control-panel">
        <div class="form-grid">
          <div class="input-group">
            <label>Bot Accounts (One per line: username:password)</label>
            <textarea id="botsInput" placeholder="BotUser1:pass123&#10;BotUser2:pass123"></textarea>
          </div>
          <div class="input-group">
            <label>SOCKS5 Proxies (One per line: host:port:user:pass)</label>
            <textarea id="proxiesInput" placeholder="192.168.1.1:1080:user:pass&#10;192.168.1.2:1080"></textarea>
          </div>
          <div class="input-group">
            <label>Server IP / Host</label>
            <input type="text" id="serverHost" value="gamester.org:25565">
          </div>
        </div>
        <div class="button-group">
          <button class="btn btn-success" onclick="launchFleet()">🚀 Launch Bot Fleet</button>
          <button class="btn btn-danger" onclick="stopAllBots()">🛑 Stop All Bots</button>
        </div>
      </div>

      <!-- Statistics Bar -->
      <div class="grid-cards">
        <div class="card">
          <div class="card-title">Active Bots</div>
          <div class="card-num" id="statActive">0</div>
        </div>
        <div class="card">
          <div class="card-title">Target Reached (20h 10m)</div>
          <div class="card-num" id="statCompleted" style="color: var(--accent-green);">0</div>
        </div>
        <div class="card">
          <div class="card-title">Proxy Down Table</div>
          <div class="card-num" id="statProxyDown" style="color: var(--accent-yellow);">0</div>
        </div>
        <div class="card">
          <div class="card-title">Banned Accounts</div>
          <div class="card-num" id="statBanned" style="color: var(--accent-red);">0</div>
        </div>
      </div>

      <!-- Active Bots Table -->
      <div class="table-section">
        <div class="table-title">Active Bots Monitor</div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Bot Name</th>
                <th>Proxy</th>
                <th>Ping</th>
                <th>Drops</th>
                <th>20h 10m Progress</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="activeBotsTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Proxy Down Table -->
      <div class="table-section">
        <div class="table-title" style="color: var(--accent-yellow);">Proxy Down Table (Capped at 5 Drops)</div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Bot Name</th>
                <th>Failed Proxy</th>
                <th>Reason</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="proxyDownTable"></tbody>
          </table>
        </div>
      </div>

      <!-- System Console -->
      <div class="console-box" id="consoleBox"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const TARGET_MS = (20 * 3600 + 10 * 60) * 1000;

    socket.on('state_update', (data) => {
      document.getElementById('statActive').innerText = data.bots.length;
      document.getElementById('statCompleted').innerText = data.targetCompleted.length;
      document.getElementById('statProxyDown').innerText = data.proxyDown.length;
      document.getElementById('statBanned').innerText = data.bannedBots.length;

      renderStaffList(data.staff);
      renderActiveBots(data.bots);
      renderProxyDown(data.proxyDown);
    });

    socket.on('log', (log) => {
      const box = document.getElementById('consoleBox');
      const div = document.createElement('div');
      div.className = `log-line log-${log.type}`;
      div.innerText = `[${log.timestamp}] ${log.msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    function renderStaffList(staff) {
      const container = document.getElementById('staffList');
      container.innerHTML = staff.map(s => `
        <div class="staff-card">
          <div class="staff-info">
            <img class="staff-avatar" src="https://mc-heads.net/avatar/${s}/64" alt="${s}">
            <span>${s}</span>
          </div>
          <button class="remove-staff-btn" onclick="removeStaff('${s}')">×</button>
        </div>
      `).join('');
    }

    function renderActiveBots(bots) {
      const container = document.getElementById('activeBotsTable');
      if (bots.length === 0) {
        container.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b;">No active bots running.</td></tr>`;
        return;
      }
      container.innerHTML = bots.map(b => {
        const pct = Math.min(100, ((b.afkDurationMs / TARGET_MS) * 100)).toFixed(1);
        return `
          <tr>
            <td><b>${b.username}</b></td>
            <td>${b.proxy}</td>
            <td>${b.ping} ms</td>
            <td>${b.dropCount} / 5</td>
            <td>
              <div>${pct}% (${formatMs(b.afkDurationMs)})</div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pct}%;"></div>
              </div>
            </td>
            <td><span style="color: var(--accent-green);">${b.status}</span></td>
            <td><button onclick="stopBot('${b.username}')" style="background: var(--accent-red); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Stop</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderProxyDown(list) {
      const container = document.getElementById('proxyDownTable');
      if (list.length === 0) {
        container.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#64748b;">No failed proxies recorded.</td></tr>`;
        return;
      }
      container.innerHTML = list.map(item => `
        <tr>
          <td>${item.username}</td>
          <td>${item.proxy}</td>
          <td>${item.reason}</td>
          <td>${item.timestamp}</td>
        </tr>
      `).join('');
    }

    function launchFleet() {
      const rawBots = document.getElementById('botsInput').value.trim();
      const rawProxies = document.getElementById('proxiesInput').value.trim();

      if (!rawBots) {
        alert('Please enter at least one bot account (username:password)');
        return;
      }

      const botList = rawBots.split('\n').map(line => {
        const [username, password] = line.trim().split(':');
        return { username, password };
      }).filter(b => b.username && b.password);

      const proxyList = rawProxies ? rawProxies.split('\n').map(p => p.trim()).filter(p => p.length > 0) : [];

      socket.emit('start_bots_fleet', { botList, proxyList });
    }

    function stopAllBots() {
      socket.emit('stop_all_bots');
    }

    function stopBot(username) {
      socket.emit('stop_bot', username);
    }

    function addStaff() {
      const input = document.getElementById('newStaffInput');
      if (input.value.trim()) {
        socket.emit('add_staff', input.value.trim());
        input.value = '';
      }
    }

    function removeStaff(name) {
      socket.emit('remove_staff', name);
    }

    function formatMs(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      return `${h}h ${m}m`;
    }
  </script>
</body>
</html>
