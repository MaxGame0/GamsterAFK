<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Client | DarkAFK</title>
    <style>
        :root { --bg: #0a0a0c; --panel: rgba(17, 17, 22, 0.8); --accent: #9333ea; --accent-glow: #6b21a8; --text: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: var(--panel); backdrop-filter: blur(10px); padding: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .sidebar h1 { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); margin-bottom: 30px; font-size: 24px; text-align: center; }
        .nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text); cursor: pointer; border-radius: 6px; transition: 0.3s; text-align: left; }
        .nav-btn:hover, .nav-btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        
        /* Main Content */
        .main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .view { display: none; }
        .view.active { display: block; }
        
        /* Dashboard & Cards */
        .header-stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--panel); padding: 15px 25px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card span { color: var(--accent); font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--accent); }
        
        /* Forms & Inputs */
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; }
        input:focus { outline: none; border-color: var(--accent); }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { box-shadow: 0 0 15px var(--accent-glow); }
        
        /* Console */
        .console-box { background: #000; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #a0aec0; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        
        /* Layout Utilities */
        .flex-row { display: flex; gap: 15px; align-items: center; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Sleepy Client</h1>
        <button class="nav-btn active" onclick="switchTab('dashboard')">Dashboard</button>
        <button class="nav-btn" onclick="switchTab('console')">Global Console</button>
        <button class="nav-btn" onclick="switchTab('proxydown')">Proxy Down Recovery</button>
        <button class="nav-btn" onclick="switchTab('checker')">Proxy Checker</button>
    </div>

    <div class="main">
        <div class="header-stats">
            <div class="stat-card">CPU: <span id="sys-cpu">0%</span></div>
            <div class="stat-card">RAM: <span id="sys-ram">0%</span></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="view active">
            <h2>Deploy New Bot</h2><br>
            <div style="background: var(--panel); padding: 20px; border-radius: 8px; max-width: 500px;">
                <select id="auth-type" onchange="toggleAuthFields()">
                    <option value="offline">Cracked (Offline)</option>
                    <option value="microsoft">Microsoft (OAuth)</option>
                </select>
                <input type="text" id="bot-user" placeholder="Username (Leave empty for MS)">
                <input type="password" id="bot-pass" placeholder="Server /login Password (Cracked Only)">
                <input type="text" id="bot-proxy" placeholder="Proxy (IP:PORT)">
                <button class="btn" onclick="deployBot()">Deploy to Gamester</button>
            </div>
            <br>
            <h2>Active Bots</h2>
            <table>
                <thead><tr><th>Username</th><th>Status</th><th>Uptime</th></tr></thead>
                <tbody id="active-bots-list"></tbody>
            </table>
        </div>

        <!-- Global Console -->
        <div id="console" class="view">
            <h2>Global Console & Logs</h2><br>
            <div class="console-box" id="sys-logs"></div>
            <div class="flex-row">
                <input type="text" id="g-cmd" placeholder="Enter chat or command (e.g., /spawn)" style="margin:0;">
                <button class="btn" onclick="sendGlobal()">Send to All</button>
            </div>
        </div>

        <!-- Proxy Down -->
        <div id="proxydown" class="view">
            <h2>Proxy Down Recovery</h2>
            <p style="color:#a0aec0; margin-bottom:15px;">Select bots to revive and assign a new proxy. Uptime will resume.</p>
            <div class="flex-row">
                <input type="text" id="recovery-proxy" placeholder="New Proxy (IP:PORT)" style="margin:0;">
                <button class="btn" onclick="reviveBots()">Revive Selected</button>
            </div>
            <table>
                <thead><tr><th>Select</th><th>Username</th><th>Paused Uptime</th></tr></thead>
                <tbody id="proxy-down-list"></tbody>
            </table>
        </div>

        <!-- Proxy Checker -->
        <div id="checker" class="view">
            <h2>Proxy Sticky/Rotating Checker</h2><br>
            <div style="background: var(--panel); padding: 20px; border-radius: 8px; max-width: 500px;">
                <input type="text" id="check-proxy-input" placeholder="Proxy (IP:PORT)">
                <button class="btn" onclick="runProxyCheck()">Check</button>
                <div id="proxy-result" style="margin-top: 15px; color: var(--accent);"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Format MS to 00h 00m 00s
        function formatUptime(ms) {
            let seconds = Math.floor((ms / 1000) % 60);
            let minutes = Math.floor((ms / (1000 * 60)) % 60);
            let hours = Math.floor((ms / (1000 * 60 * 60)));
            return `${hours}h ${minutes}m${seconds}s`;
        }

        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // UI Toggles
        function toggleAuthFields() {
            const type = document.getElementById('auth-type').value;
            const uField = document.getElementById('bot-user');
            const pField = document.getElementById('bot-pass');
            if(type === 'microsoft') {
                uField.style.display = 'none';
                pField.style.display = 'none';
            } else {
                uField.style.display = 'block';
                pField.style.display = 'block';
            }
        }

        // Actions
        function deployBot() {
            const auth = document.getElementById('auth-type').value;
            const username = document.getElementById('bot-user').value;
            const password = document.getElementById('bot-pass').value;
            const proxyStr = document.getElementById('bot-proxy').value;
            socket.emit('deploy', { username, password, auth, proxyStr });
        }

        function sendGlobal() {
            const cmd = document.getElementById('g-cmd').value;
            if(!cmd) return;
            socket.emit('global_command', cmd);
            document.getElementById('g-cmd').value = '';
        }

        function runProxyCheck() {
            const p = document.getElementById('check-proxy-input').value;
            document.getElementById('proxy-result').innerText = "Testing 5 requests...";
            socket.emit('check_proxy', p);
        }

        function reviveBots() {
            const checks = document.querySelectorAll('.recover-chk:checked');
            const ids = Array.from(checks).map(c => c.value);
            const newProxy = document.getElementById('recovery-proxy').value;
            if(ids.length > 0 && newProxy) {
                socket.emit('revive_bots', { ids, newProxy });
            }
        }

        // Socket Listeners
        socket.on('sys_stats', data => {
            document.getElementById('sys-cpu').innerText = data.cpu + '%';
            document.getElementById('sys-ram').innerText = data.ram + '%';
        });

        socket.on('sys_log', msg => {
            const box = document.getElementById('sys-logs');
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}]${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('update_bots', bots => {
            const tbody = document.getElementById('active-bots-list');
            tbody.innerHTML = '';
            bots.forEach(b => {
                tbody.innerHTML += `<tr><td>${b.username || 'MS_Auth_Pending'}</td><td>${b.status}</td><td>${formatUptime(b.uptime)}</td></tr>`;
            });
        });

        socket.on('update_proxy_down', bots => {
            const tbody = document.getElementById('proxy-down-list');
            tbody.innerHTML = '';
            bots.forEach(b => {
                tbody.innerHTML += `<tr>
                    <td><input type="checkbox" class="recover-chk" value="${b.id}"></td>
                    <td>${b.username}</td>
                    <td>${formatUptime(b.uptime)}</td>
                </tr>`;
            });
        });

        socket.on('proxy_tool_result', res => {
            if(!res.alive) document.getElementById('proxy-result').innerText = "Proxy is Dead.";
            else document.getElementById('proxy-result').innerText = `Alive! Type: ${res.type}. IPs: ${res.endpoints.join(', ')}`;
        });
    </script>
</body>
</html>
