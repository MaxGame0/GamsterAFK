<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sleepy Client | Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #09090b; color: #f4f4f5; padding: 30px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { border-bottom: 1px solid #27272a; padding-bottom: 20px; margin-bottom: 30px; }
    h1 { color: #818cf8; font-size: 2rem; letter-spacing: 2px; }
    .panel { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; background: #09090b; border: 1px solid #3f3f46; border-radius: 6px; color: #fff; outline: none; }
    input:focus, select:focus { border-color: #818cf8; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #d4d4d8; font-size: 0.9rem; margin-bottom: 10px;}
    .checkbox-group input { width: auto; }
    .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; background: #3f3f46; width: 100%; }
    .btn-primary { background: #4f46e5; }
    .btn-primary:hover { background: #4338ca; }
    .btn-danger { background: #e11d48; }
    .bot-card { background: #09090b; border: 1px solid #27272a; border-left: 4px solid #4f46e5; border-radius: 8px; padding: 15px; }
    .bot-card h3 { color: #818cf8; margin-bottom: 10px; }
    .bot-card p { font-size: 0.85rem; color: #a1a1aa; margin-bottom: 4px; }
    .bot-card p strong { color: #f4f4f5; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: #27272a; color: #34d399; }
    .console { background: #000; border: 1px solid #27272a; padding: 10px; height: 100px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; color: #a1a1aa; margin-top: 10px; border-radius: 4px;}
    .radar-active { color: #fbbf24; border: 1px solid #fbbf24; background: rgba(251, 191, 36, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SLEEPY CLIENT</h1>
      <p style="color: #71717a; margin-top: 5px;">Proxy & Evasion Operations</p>
    </header>

    <div class="grid">
      <div class="panel">
        <h2 style="margin-bottom: 20px; font-size: 1.2rem;">Deploy New Instance</h2>
        <form id="spawn-form">
          <div class="input-group">
            <label>Server IP</label>
            <input type="text" id="server" placeholder="gamester.org:25565" required>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
              <label>Auth Type</label>
              <select id="authType">
                <option value="offline">Cracked (Offline)</option>
                <option value="microsoft">Microsoft Account</option>
              </select>
            </div>
            <div class="input-group">
              <label>Minecraft Version</label>
              <input type="text" id="version" value="1.8.9">
            </div>
          </div>

          <div class="input-group">
            <label>Email / Username</label>
            <input type="text" id="username" required>
          </div>
          <div class="input-group">
            <label>Password (For MS Auth or /login)</label>
            <input type="password" id="password">
          </div>
          <div class="input-group">
            <label>SOCKS5 Proxy (host:port:user:pass)</label>
            <input type="text" id="proxy" placeholder="Leave blank for local IP">
          </div>
          
          <div style="margin: 20px 0; padding-top: 15px; border-top: 1px solid #27272a;">
            <label class="checkbox-group">
              <input type="checkbox" id="hffaEnabled" checked> Auto-Join HardcoreFFA
            </label>
            <label class="checkbox-group">
              <input type="checkbox" id="radarEnabled" checked> Enable Anti-Staff Radar (Auto-Evade)
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Deploy Bot</button>
        </form>
      </div>

      <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="font-size: 1.2rem;">Active Fleet</h2>
          <button onclick="fetch('/api/disconnect', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: 'all'})})" class="btn btn-danger" style="width: auto;">Kill All</button>
        </div>
        <div id="fleet-container" style="display: grid; gap: 15px; max-height: 600px; overflow-y: auto;">
          <p style="color: #71717a;">No bots currently active.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('spawn-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        server: document.getElementById('server').value,
        authType: document.getElementById('authType').value,
        version: document.getElementById('version').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        proxy: document.getElementById('proxy').value,
        hffaEnabled: document.getElementById('hffaEnabled').checked,
        radarEnabled: document.getElementById('radarEnabled').checked
      };

      await fetch('/api/spawn', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('username').value = '';
      fetchFleet();
    });

    async function fetchFleet() {
      try {
        const res = await fetch('/api/status');
        const bots = await res.json();
        const container = document.getElementById('fleet-container');
        
        if (!bots.length) {
          container.innerHTML = '<p style="color: #71717a;">No bots currently active.</p>';
          return;
        }

        container.innerHTML = bots.map(b => `
          <div class="bot-card">
            <div style="display: flex; justify-content: space-between;">
              <h3>${b.username}</h3>
              <span class="status-badge ${b.radar ? 'radar-active' : ''}">${b.radar ? 'Radar ON' : 'Radar OFF'}</span>
            </div>
            <p>Auth: <strong>${b.auth}</strong> | Server: <strong>${b.host}</strong></p>
            <p>Proxy Status: <strong style="color: ${b.proxyStatus.includes('Error') ? '#e11d48' : '#34d399'}">${b.proxyStatus}</strong></p>
            <p>Uptime: <strong>${b.uptime}</strong></p>
            <div class="console">${b.chatLogs.length ? b.chatLogs.join('<br>') : 'Waiting for connection...'}</div>
            <button onclick="fetch('/api/disconnect', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: '${b.username}'})})" class="btn btn-danger" style="margin-top: 10px;">Disconnect</button>
          </div>
        `).join('');
      } catch (e) {}
    }

    setInterval(fetchFleet, 2000);
    fetchFleet();
  </script>
</body>
</html>
