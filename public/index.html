<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark AFK Bot Manager</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2e;
      --accent: #7289da;
      --danger: #e74c3c;
      --success: #2ecc71;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --border: #2a2d42;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #0d0e15;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      background: var(--accent);
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button.danger {
      background: var(--danger);
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      background: #25283d;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag span.remove-btn {
      color: var(--danger);
      cursor: pointer;
      font-weight: bold;
    }

    .flex-row {
      display: flex;
      gap: 10px;
    }

    .result-box {
      margin-top: 10px;
      padding: 10px;
      background: #0d0e15;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .badge-sticky {
      color: var(--success);
      font-weight: bold;
    }

    .badge-rotating {
      color: #f39c12;
      font-weight: bold;
    }

    .badge-dead {
      color: var(--danger);
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="full-width">
      <h1>Dark AFK Dashboard</h1>
    </div>

    <!-- Staff Evasion Card -->
    <div class="card">
      <h2>🛡️ Staff Evasion List</h2>
      <p style="font-size: 0.8rem; color: var(--text-dim);">Bots automatically quit if any player matching these keywords joins the server.</p>
      
      <div class="flex-row">
        <input type="text" id="newStaffInput" placeholder="Username or keyword (e.g. henriks9)">
        <button onclick="addStaff()" style="width: 120px;">Add Staff</button>
      </div>

      <div class="tag-container" id="staffTagList">
        <!-- Dynamic Staff Tags -->
      </div>
    </div>

    <!-- Proxy Checker Card -->
    <div class="card">
      <h2>🌐 SOCKS5 Proxy Checker</h2>
      <div class="form-group">
        <label>Proxy String (host:port or host:port:user:pass)</label>
        <input type="text" id="proxyCheckerInput" placeholder="127.0.0.1:1080:user:pass">
      </div>
      <button onclick="checkProxy()">Send 5 Requests & Check</button>
      <div id="proxyCheckResult" class="result-box" style="display: none;"></div>
    </div>

    <!-- Active Bots Card -->
    <div class="card full-width">
      <h2>🤖 Active Bots Status</h2>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Server</th>
            <th>Uptime</th>
            <th>Health / Food</th>
            <th>Proxy Host</th>
            <th>HFFA</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="activeBotsTable">
          <!-- Active bots dynamic render -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- Staff Management Functions ---

    async function loadStaffList() {
      try {
        const res = await fetch('/api/staff');
        const data = await res.json();
        const container = document.getElementById('staffTagList');
        container.innerHTML = '';

        data.staff.forEach(name => {
          const tag = document.createElement('div');
          tag.className = 'tag';
          tag.innerHTML = `
            <span>${name}</span>
            <span class="remove-btn" onclick="removeStaff('${name}')">&times;</span>
          `;
          container.appendChild(tag);
        });
      } catch (err) {
        console.error('Failed to load staff list:', err);
      }
    }

    async function addStaff() {
      const input = document.getElementById('newStaffInput');
      const username = input.value.trim();
      if (!username) return;

      try {
        const res = await fetch('/api/staff/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        if (data.error) {
          alert(data.error);
        } else {
          input.value = '';
          loadStaffList();
        }
      } catch (err) {
        alert('Failed to add staff member');
      }
    }

    async function removeStaff(username) {
      try {
        const res = await fetch('/api/staff/remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        if (data.error) {
          alert(data.error);
        } else {
          loadStaffList();
        }
      } catch (err) {
        alert('Failed to remove staff member');
      }
    }

    // --- Proxy Checker Function ---

    async function checkProxy() {
      const proxy = document.getElementById('proxyCheckerInput').value.trim();
      const resultBox = document.getElementById('proxyCheckResult');

      if (!proxy) return alert('Enter a proxy string first!');

      resultBox.style.display = 'block';
      resultBox.innerHTML = 'Testing proxy with 5 consecutive requests...';

      try {
        const res = await fetch('/api/check-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proxy })
        });
        const data = await res.json();

        if (!data.success) {
          resultBox.innerHTML = `<span class="badge-dead">DEAD / FAILED</span><br>${data.message}`;
          return;
        }

        const badge = data.type === 'sticky' 
          ? '<span class="badge-sticky">STICKY PROXY</span>' 
          : '<span class="badge-rotating">ROTATING PROXY</span>';

        let html = `${badge}<br><br><b>5 Request Endpoint IPs:</b><br>`;
        data.endpointIps.forEach((ip, idx) => {
          html += `Request ${idx + 1}: ${ip}<br>`;
        });

        resultBox.innerHTML = html;
      } catch (err) {
        resultBox.innerHTML = '<span class="badge-dead">Error checking proxy.</span>';
      }
    }

    // --- Active Bots Fetch ---

    async function loadBotStatus() {
      try {
        const res = await fetch('/api/status');
        const bots = await res.json();
        const tbody = document.getElementById('activeBotsTable');
        tbody.innerHTML = '';

        if (bots.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-dim);">No active bots connected.</td></tr>';
          return;
        }

        bots.forEach(bot => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><b>${bot.username}</b></td>
            <td>${bot.host}</td>
            <td>${bot.activeUptime}</td>
            <td>❤️ ${bot.health} / 🍗 ${bot.food}</td>
            <td>${bot.proxy}</td>
            <td>${bot.hffaActive ? 'Yes' : 'No'}</td>
            <td><button class="danger" onclick="stopBot('${bot.username}')" style="padding: 4px 8px; font-size: 0.8rem;">Disconnect</button></td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Error fetching bot status:', err);
      }
    }

    async function stopBot(username) {
      await fetch('/api/bots/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      loadBotStatus();
    }

    // Initial Load & Auto Refresh
    loadStaffList();
    loadBotStatus();
    setInterval(loadBotStatus, 5000);
  </script>
</body>
</html>
