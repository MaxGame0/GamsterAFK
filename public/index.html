<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bot Web Dashboard</title>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1e1e24;
      --card-border: #2a2a32;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --danger: #ed4245;
      --danger-hover: #c03537;
      --success: #57f287;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --input-bg: #0e0e10;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
    
    header {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* TOP NAVIGATION BAR */
    .navbar {
      display: flex;
      gap: 10px;
      background-color: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.2s;
    }
    .nav-btn:hover { background-color: #2b2d31; color: var(--text-main); }
    .nav-btn.active { background-color: var(--primary); color: white; }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }
    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-danger { background-color: var(--danger); }
    .btn-danger:hover { background-color: var(--danger-hover); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .panel { background-color: var(--card-bg); border-radius: 8px; border: 1px solid var(--card-border); padding: 20px; margin-bottom: 20px; }
    .panel h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--text-muted); text-transform: uppercase; }

    /* Bot Cards */
    .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
    .bot-card { background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 15px; }
    .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .bot-name { font-weight: bold; font-size: 1.1rem; }
    .bot-status { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; }
    .status-online { background-color: rgba(87, 242, 135, 0.2); color: var(--success); }
    .status-offline { background-color: rgba(237, 66, 69, 0.2); color: var(--danger); }
    .bot-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
    
    .form-group { margin-bottom: 15px; max-width: 400px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    input { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 4px; color: var(--text-main); }
    
    .console-logs { background-color: #000; border: 1px solid var(--card-border); border-radius: 4px; height: 150px; padding: 10px; font-family: monospace; font-size: 0.85rem; overflow-y: auto; color: #00ffcc; }
    .log-entry { margin-bottom: 4px; }

    /* Inventory Screen */
    .inventory-container { display: flex; flex-direction: column; gap: 15px; align-items: start; }
    .inventory-canvas-box { border: 2px solid var(--card-border); background: #000; border-radius: 6px; padding: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Minecraft Bot Control Center</h1>
      <button class="btn btn-danger" onclick="stopAll()">🛑 Emergency Stop All</button>
    </header>

    <!-- Top Navigation Bar -->
    <div class="navbar">
      <button class="nav-btn active" onclick="switchTab('dashboardTab', this)">📊 Dashboard</button>
      <button class="nav-btn" onclick="switchTab('spawnTab', this)">➕ Spawn Bots</button>
      <button class="nav-btn" onclick="switchTab('inventoryTab', this)">🎒 Inventory Manager</button>
      <button class="nav-btn" onclick="switchTab('proxyTab', this)">🔄 Set / Check Proxy</button>
      <button class="nav-btn" onclick="switchTab('moveTab', this)">🚶 Move Bot</button>
      <button class="nav-btn" onclick="switchTab('staffTab', this)">🛡️ Staff List</button>
    </div>

    <!-- TAB 1: DASHBOARD -->
    <div id="dashboardTab" class="tab-content active">
      <div class="panel">
        <h2>Active Bots (<span id="botCount">0</span>)</h2>
        <div class="bot-grid" id="botGrid">
          <p style="color: var(--text-muted);">No active bots running.</p>
        </div>
      </div>
    </div>

    <!-- TAB 2: SPAWN BOTS -->
    <div id="spawnTab" class="tab-content">
      <div class="panel">
        <h2>➕ Spawn New Bots</h2>
        <div class="form-group">
          <label>Server Address</label>
          <input type="text" id="spawnServer" value="as.gamster.org:25565">
        </div>
        <div class="form-group">
          <label>Usernames (comma separated)</label>
          <input type="text" id="spawnUsernames" placeholder="Bot1, Bot2, Bot3">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="spawnPassword">
        </div>
        <div class="form-group">
          <label>SOCKS5 Proxy (Optional)</label>
          <input type="text" id="spawnProxy" placeholder="IP:Port:User:Pass">
        </div>
        <button class="btn btn-primary" onclick="submitSpawn()">Spawn Bots</button>
      </div>
    </div>

    <!-- TAB 3: INVENTORY MANAGER -->
    <div id="inventoryTab" class="tab-content">
      <div class="panel">
        <h2>🎒 Inventory Control</h2>
        <div style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 15px;">
          <div class="form-group" style="margin-bottom:0;">
            <label>Bot Username</label>
            <input type="text" id="invTargetUser" placeholder="Enter Bot Name">
          </div>
          <button class="btn btn-primary" onclick="loadBotInventory()">Load Inventory</button>
        </div>

        <div class="inventory-container" id="inventoryDisplayArea" style="display: none;">
          <div class="inventory-canvas-box">
            <img id="inventoryImg" src="" alt="Inventory Loading..." style="display:block;">
          </div>

          <div style="display: flex; gap: 10px; align-items: flex-end; background-color: var(--input-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--card-border);">
            <div class="form-group" style="margin-bottom:0; width: 100px;">
              <label>Slot (0 - 35)</label>
              <input type="number" id="invSlotInput" min="0" max="35" value="0">
            </div>
            <button class="btn btn-primary" onclick="clickInventorySlot(0)">Left Click</button>
            <button class="btn btn-primary" style="background-color: #9b59b6;" onclick="clickInventorySlot(1)">Right Click</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 4: PROXY SET / CHECK -->
    <div id="proxyTab" class="tab-content">
      <div class="panel">
        <h2>🔄 Update Bot Proxy</h2>
        <div class="form-group">
          <label>Target Bot Username</label>
          <input type="text" id="setProxyUser" placeholder="Bot Username">
        </div>
        <div class="form-group">
          <label>New Proxy String</label>
          <input type="text" id="setProxyInput" placeholder="IP:Port:User:Pass">
        </div>
        <button class="btn btn-primary" onclick="submitSetProxy()">Update Proxy & Revive</button>
      </div>

      <div class="panel">
        <h2>📡 Check Proxy Type (5 Requests Test)</h2>
        <div class="form-group">
          <label>Proxy String</label>
          <input type="text" id="checkProxyInput" placeholder="IP:Port:User:Pass">
        </div>
        <button class="btn btn-primary" onclick="submitCheckProxy()">Test Proxy</button>
      </div>
    </div>

    <!-- TAB 5: MOVE BOT -->
    <div id="moveTab" class="tab-content">
      <div class="panel">
        <h2>🚶 Move Bot Coordinates</h2>
        <div class="form-group">
          <label>Bot Username</label>
          <input type="text" id="moveUser" placeholder="Bot Username">
        </div>
        <div style="display: flex; gap: 10px; max-width: 400px;">
          <div class="form-group"><label>X</label><input type="number" id="moveX"></div>
          <div class="form-group"><label>Y</label><input type="number" id="moveY"></div>
          <div class="form-group"><label>Z</label><input type="number" id="moveZ"></div>
        </div>
        <button class="btn btn-primary" onclick="submitMove()">Start Movement</button>
      </div>
    </div>

    <!-- TAB 6: STAFF MANAGEMENT -->
    <div id="staffTab" class="tab-content">
      <div class="panel">
        <h2>🛡️ Staff List Evasion</h2>
        <div class="form-group">
          <label>Staff Username</label>
          <input type="text" id="staffUser" placeholder="Username">
        </div>
        <div style="display: flex; gap: 10px; max-width: 400px;">
          <button class="btn btn-primary" style="flex:1;" onclick="submitStaff('add')">Add Staff</button>
          <button class="btn btn-danger" style="flex:1;" onclick="submitStaff('remove')">Remove Staff</button>
        </div>
      </div>
    </div>

    <!-- Console Logs -->
    <div class="panel">
      <h2>Console Logs</h2>
      <div class="console-logs" id="consoleLogs">
        <div class="log-entry">[SYSTEM] Navigation Control Panel Initialized.</div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function logConsole(text) {
      const logs = document.getElementById('consoleLogs');
      logs.innerHTML += `<div class="log-entry">${text}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('botCount').innerText = data.count;

        const grid = document.getElementById('botGrid');
        if (data.bots.length === 0) {
          grid.innerHTML = '<p style="color: var(--text-muted);">No active bots running.</p>';
          return;
        }

        grid.innerHTML = data.bots.map(bot => `
          <div class="bot-card">
            <div class="bot-header">
              <span class="bot-name">${bot.username}</span>
              <span class="bot-status ${bot.isOnline ? 'status-online' : 'status-offline'}">${bot.status}</span>
            </div>
            <div class="bot-info">
              <div><strong>Uptime:</strong> ${bot.uptime}</div>
              <div><strong>Ping:</strong> ${bot.ping} ms</div>
              <div><strong>Coords:</strong> ${bot.coordinates ? `X: ${bot.coordinates.x}, Y: ${bot.coordinates.y}, Z:${bot.coordinates.z}` : 'N/A'}</div>
            </div>
            <div style="margin-top: 10px;">
              <input type="text" id="chat_${bot.username}" placeholder="Send chat..." style="padding: 5px; font-size: 0.8rem; margin-bottom: 5px;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button class="btn btn-primary" style="padding: 5px; font-size: 0.8rem;" onclick="sendChat('${bot.username}')">Chat</button>
                <button class="btn btn-danger" style="padding: 5px; font-size: 0.8rem;" onclick="stopBot('${bot.username}')">Disconnect</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {}
    }

    /* INVENTORY FEATURES */
    let invRefreshInterval = null;

    function loadBotInventory() {
      const username = document.getElementById('invTargetUser').value.trim();
      if (!username) return alert('Enter a bot username');

      document.getElementById('inventoryDisplayArea').style.display = 'flex';
      const img = document.getElementById('inventoryImg');

      if (invRefreshInterval) clearInterval(invRefreshInterval);
      
      const updateImg = () => { img.src = `/api/inventory/${username}?t=${Date.now()}`; };
      updateImg();
      invRefreshInterval = setInterval(updateImg, 3000);
      logConsole(`Viewing inventory for bot: ${username}`);
    }

    async function clickInventorySlot(mouseButton) {
      const username = document.getElementById('invTargetUser').value.trim();
      const slot = document.getElementById('invSlotInput').value;
      if (!username) return alert('Enter a bot username');

      await fetch('/api/inventory/click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, slot: parseInt(slot), mouseButton })
      });

      logConsole(`Executed ${mouseButton === 0 ? 'LEFT' : 'RIGHT'} click on slot ${slot} for ${username}`);
      setTimeout(loadBotInventory, 500);
    }

    async function submitSpawn() {
      const server = document.getElementById('spawnServer').value;
      const usernames = document.getElementById('spawnUsernames').value;
      const password = document.getElementById('spawnPassword').value;
      const proxy = document.getElementById('spawnProxy').value;

      await fetch('/api/spawn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ server, usernames, password, proxy })
      });
      logConsole(`Requested spawn for: ${usernames}`);
      fetchStatus();
    }

    async function submitSetProxy() {
      const username = document.getElementById('setProxyUser').value;
      const proxy = document.getElementById('setProxyInput').value;

      await fetch('/api/setproxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, proxy })
      });
      logConsole(`Updated proxy for bot: ${username}`);
    }

    async function submitCheckProxy() {
      const proxy = document.getElementById('checkProxyInput').value;
      logConsole(`Testing proxy 5 times... Please wait.`);

      const res = await fetch('/api/checkproxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proxy })
      });
      const data = await res.json();
      logConsole(`[PROXY RESULT] ${data.result} | IPs: ${data.ips.join(', ')}`);
    }

    async function submitMove() {
      const username = document.getElementById('moveUser').value;
      const x = document.getElementById('moveX').value;
      const y = document.getElementById('moveY').value;
      const z = document.getElementById('moveZ').value;

      await fetch('/api/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, x: parseFloat(x), y: parseFloat(y), z: parseFloat(z) })
      });
      logConsole(`Initiated move for ${username} to (${x}, ${y}, ${z})`);
    }

    async function submitStaff(action) {
      const username = document.getElementById('staffUser').value;
      await fetch('/api/staff', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, username })
      });
      logConsole(`Staff list ${action}: ${username}`);
    }

    async function sendChat(target) {
      const msgInput = document.getElementById(`chat_${target}`);
      const message = msgInput.value;
      await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target, message })
      });
      logConsole(`[Chat] [${target}]: ${message}`);
      msgInput.value = '';
    }

    async function stopBot(username) {
      await fetch('/api/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      logConsole(`Stopped bot: ${username}`);
      fetchStatus();
    }

    async function stopAll() { stopBot('all'); }

    setInterval(fetchStatus, 4000);
    fetchStatus();
  </script>
</body>
</html>
